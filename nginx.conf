# Cache policy for a hand-maintained static site.
#
# The origin sent no cache headers at all, so Cloudflare applied its own
# defaults — and those defaults are what produced the 2026-09-05 incident: a
# menu fix, correct, deployed and verified in a browser, still broken for the
# person looking at it, served from the edge with `cf-cache-status: HIT`,
# `age: 1332` and `last-modified: Mon, 17 Aug 2026`.
#
# tools/stamp-assets.mjs answered that by putting a content hash in the asset
# URLs, and that is the real fix. But it only works if the PAGE carrying the new
# URL reaches the browser — a cached page hands out the old `?v=` and the
# stamping is silently defeated. So HTML is explicitly no-cache here: it is the
# thing that points at everything else.
#
# There is no build step, so filenames are not content-hashed on disk and
# immutable long-lived caching is not available for a bare path. Short TTLs plus
# revalidation is the honest trade for anything that reaches one.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML must never be stale — it carries the stamped asset URLs.
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
  }
  location = / {
    add_header Cache-Control "no-cache" always;
  }

  # Deploy verification. Written into the image by the Dockerfile as a hash of
  # every served file, because there is no application process here to compute
  # one at startup. It must NEVER be cached: a cached deploy-check answers for
  # the deploy before the one you are asking about, which is worse than no check
  # at all.
  location = /api/build {
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Assets are linked with ?v=<content hash>, so a changed file is a changed URL
  # and the cache is sidestepped rather than negotiated with. This TTL is the
  # second line of defence for anything reaching the bare path.
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # Images and fonts change rarely and are usually replaced rather than edited.
  location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400" always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
